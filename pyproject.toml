[project]
name = "stegawave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asmit Yadav", email = "asmit12yadav@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=5.0.0",
    "numpy>=2.0.0",
    "pillow>=10.2.0,<13.0.0",
    "scikit-image>=0.24.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
