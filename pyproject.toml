[project]
name = "stegawave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asmit Yadav", email = "asmit12yadav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
stegawave = "stegawave:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
